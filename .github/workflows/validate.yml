# SPDX-License-Identifier: Apache-2.0
# Runs the validator, its self-test and the tests on every push and pull request.
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the checker's dependencies (NumPy, PyYAML)
        run: python3 -m pip install numpy pyyaml
      - name: Validate the example records
        run: python3 -I spec/validate.py
      - name: Run the tests
        run: python3 -I -B -m unittest discover -s spec/tests -v
